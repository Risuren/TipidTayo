<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="pigBodyDanger" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E57373"/>
      <stop offset="100%" stop-color="#C62828"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.2"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="100" cy="180" rx="65" ry="12" fill="#E2E8F0" opacity="0.6"/>

  <!-- Drooping Ears -->
  <path d="M 45 78 C 25 65 40 50 62 62 Z" fill="#B71C1C" filter="url(#softShadow)"/>
  <path d="M 50 74 C 35 65 45 58 58 64 Z" fill="#FFCDD2"/>

  <path d="M 155 78 C 175 65 160 50 138 62 Z" fill="#B71C1C" filter="url(#softShadow)"/>
  <path d="M 150 74 C 165 65 155 58 142 64 Z" fill="#FFCDD2"/>

  <!-- Main Body (Red-flushed) -->
  <circle cx="100" cy="110" r="68" fill="url(#pigBodyDanger)" filter="url(#softShadow)"/>

  <!-- Coin Slot -->
  <rect x="88" y="44" width="24" height="6" rx="3" fill="#7F1D1D"/>

  <!-- Crying Eyes (Waterfalls) -->
  <path d="M 70 96 Q 78 86 86 96" fill="none" stroke="#7F1D1D" stroke-width="4" stroke-linecap="round"/>
  <path d="M 114 96 Q 122 86 130 96" fill="none" stroke="#7F1D1D" stroke-width="4" stroke-linecap="round"/>

  <!-- Teardrop Streams -->
  <path d="M 72 102 C 65 115 68 135 70 145" fill="none" stroke="#60A5FA" stroke-width="5" stroke-linecap="round" opacity="0.85"/>
  <path d="M 128 102 C 135 115 132 135 130 145" fill="none" stroke="#60A5FA" stroke-width="5" stroke-linecap="round" opacity="0.85"/>

  <!-- Snout -->
  <ellipse cx="100" cy="116" rx="24" ry="17" fill="#EF9A9A" stroke="#B71C1C" stroke-width="2"/>
  <ellipse cx="92" cy="116" rx="4" ry="6" fill="#7F1D1D"/>
  <ellipse cx="108" cy="116" rx="4" ry="6" fill="#7F1D1D"/>

  <!-- Crying Mouth (Open Frown) -->
  <path d="M 88 144 Q 100 134 112 144 Q 100 152 88 144 Z" fill="#7F1D1D"/>

  <!-- Alert Siren on Top -->
  <g transform="translate(93, 26)">
    <polygon points="7,0 0,16 14,16" fill="#FBBF24"/>
    <circle cx="7" cy="8" r="3" fill="#EF4444"/>
  </g>

  <!-- Feet -->
  <ellipse cx="78" cy="172" rx="14" ry="9" fill="#B71C1C"/>
  <ellipse cx="122" cy="172" rx="14" ry="9" fill="#B71C1C"/>
</svg>
