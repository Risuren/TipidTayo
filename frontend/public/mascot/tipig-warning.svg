<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="pigBodyWarn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#81C784"/>
      <stop offset="100%" stop-color="#388E3C"/>
    </linearGradient>
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="100" cy="180" rx="65" ry="12" fill="#E2E8F0" opacity="0.6"/>

  <!-- Left Ear (slightly drooping) -->
  <path d="M 50 68 C 30 45 55 35 70 52 Z" fill="#2E7D32" filter="url(#softShadow)"/>
  <path d="M 55 64 C 40 50 55 42 65 54 Z" fill="#C8E6C9"/>

  <!-- Right Ear -->
  <path d="M 150 65 C 165 35 140 25 125 48 Z" fill="#2E7D32" filter="url(#softShadow)"/>
  <path d="M 145 60 C 155 42 140 35 130 50 Z" fill="#C8E6C9"/>

  <!-- Main Body -->
  <circle cx="100" cy="110" r="68" fill="url(#pigBodyWarn)" filter="url(#softShadow)"/>

  <!-- Coin Slot -->
  <rect x="88" y="44" width="24" height="6" rx="3" fill="#1B4332"/>

  <!-- Wide Nervous Eyes with Big Pupils -->
  <circle cx="78" cy="95" r="9" fill="#FFFFFF"/>
  <circle cx="80" cy="95" r="5" fill="#1B4332"/>
  <circle cx="82" cy="93" r="2" fill="#FFFFFF"/>

  <circle cx="122" cy="95" r="9" fill="#FFFFFF"/>
  <circle cx="120" cy="95" r="5" fill="#1B4332"/>
  <circle cx="122" cy="93" r="2" fill="#FFFFFF"/>

  <!-- Nervous Eyebrows -->
  <path d="M 70 82 Q 78 86 86 82" fill="none" stroke="#1B4332" stroke-width="3" stroke-linecap="round"/>
  <path d="M 114 82 Q 122 86 130 82" fill="none" stroke="#1B4332" stroke-width="3" stroke-linecap="round"/>

  <!-- Blue Sweat Drop on Temple -->
  <path d="M 142 80 C 146 72 152 75 148 83 C 146 87 142 86 142 80 Z" fill="#60A5FA"/>

  <!-- Snout -->
  <ellipse cx="100" cy="116" rx="24" ry="17" fill="#A5D6A7" stroke="#2E7D32" stroke-width="2"/>
  <ellipse cx="92" cy="116" rx="4" ry="6" fill="#1B4332"/>
  <ellipse cx="108" cy="116" rx="4" ry="6" fill="#1B4332"/>

  <!-- Wavy Nervous Mouth -->
  <path d="M 90 140 Q 95 137 100 140 Q 105 143 110 140" fill="none" stroke="#1B4332" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Clutched Coin -->
  <g transform="translate(125, 120)">
    <circle cx="16" cy="16" r="16" fill="url(#goldCoin)" stroke="#B45309" stroke-width="2" filter="url(#softShadow)"/>
    <text x="16" y="22" font-family="Inter, sans-serif" font-size="14" font-weight="900" fill="#78350F" text-anchor="middle">₱</text>
  </g>

  <!-- Feet -->
  <ellipse cx="78" cy="172" rx="14" ry="9" fill="#2E7D32"/>
  <ellipse cx="122" cy="172" rx="14" ry="9" fill="#2E7D32"/>
</svg>
