<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="pigBodyPointing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="calcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="softShadowPointing" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="100" cy="180" rx="65" ry="12" fill="#E2E8F0" opacity="0.6"/>

  <!-- Left Ear -->
  <path d="M 50 65 C 35 35 60 25 75 48 Z" fill="#388E3C" filter="url(#softShadowPointing)"/>
  <path d="M 55 60 C 45 42 60 35 70 50 Z" fill="#A5D6A7"/>

  <!-- Right Ear -->
  <path d="M 150 65 C 165 35 140 25 125 48 Z" fill="#388E3C" filter="url(#softShadowPointing)"/>
  <path d="M 145 60 C 155 42 140 35 130 50 Z" fill="#A5D6A7"/>

  <!-- Main Body -->
  <circle cx="100" cy="110" r="68" fill="url(#pigBodyPointing)" filter="url(#softShadowPointing)"/>

  <!-- Coin Slot on Top -->
  <rect x="88" y="44" width="24" height="6" rx="3" fill="#1B4332"/>

  <!-- Smart Student Glasses -->
  <circle cx="75" cy="94" r="14" fill="#FFFFFF" opacity="0.4" stroke="#1B4332" stroke-width="3"/>
  <circle cx="125" cy="94" r="14" fill="#FFFFFF" opacity="0.4" stroke="#1B4332" stroke-width="3"/>
  <path d="M 89 94 L 111 94" stroke="#1B4332" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Inquisitive Eyes Behind Glasses -->
  <circle cx="77" cy="94" r="5" fill="#1B4332"/>
  <circle cx="75" cy="92" r="2" fill="#FFFFFF"/>
  <circle cx="127" cy="94" r="5" fill="#1B4332"/>
  <circle cx="125" cy="92" r="2" fill="#FFFFFF"/>

  <!-- Rosy Cheeks -->
  <circle cx="58" cy="114" r="9" fill="#FF8A80" opacity="0.5"/>
  <circle cx="142" cy="114" r="9" fill="#FF8A80" opacity="0.5"/>

  <!-- Snout -->
  <ellipse cx="100" cy="118" rx="23" ry="16" fill="#81C784" stroke="#2E7D32" stroke-width="2"/>
  <!-- Nostrils -->
  <ellipse cx="93" cy="118" rx="4" ry="5" fill="#1B4332"/>
  <ellipse cx="107" cy="118" rx="4" ry="5" fill="#1B4332"/>

  <!-- Enthusiastic Smile -->
  <path d="M 91 138 Q 100 148 109 138" fill="none" stroke="#1B4332" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Left Trotter Holding Calculator -->
  <g transform="translate(30, 100)" filter="url(#softShadowPointing)">
    <rect x="0" y="0" width="28" height="36" rx="6" fill="#1B4332" stroke="#4CAF50" stroke-width="1.5"/>
    <rect x="4" y="4" width="20" height="9" rx="2" fill="#D7EED9"/>
    <text x="14" y="11" font-family="monospace" font-size="7" font-weight="900" fill="#1B4332" text-anchor="middle">₱320</text>
    <circle cx="7" cy="18" r="2" fill="#FBBF24"/>
    <circle cx="14" cy="18" r="2" fill="#FBBF24"/>
    <circle cx="21" cy="18" r="2" fill="#FBBF24"/>
    <circle cx="7" cy="25" r="2" fill="#FFFFFF"/>
    <circle cx="14" cy="25" r="2" fill="#FFFFFF"/>
    <circle cx="21" cy="25" r="2" fill="#FFFFFF"/>
  </g>

  <!-- Right Hand POINTING ENTHUSIASTICALLY -->
  <g transform="translate(142, 108)">
    <path d="M 0 0 C 12 -6 24 -12 36 -12 C 42 -12 44 -6 36 0 C 24 8 12 12 0 6 Z" fill="#2E7D32" filter="url(#softShadowPointing)"/>
    <circle cx="36" cy="-8" r="5" fill="#81C784"/>
    <!-- Glow spark from pointing finger -->
    <path d="M 46 -8 L 52 -8 M 49 -11 L 49 -5" stroke="#F59E0B" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Little Front Feet -->
  <ellipse cx="78" cy="172" rx="14" ry="9" fill="#2E7D32"/>
  <ellipse cx="122" cy="172" rx="14" ry="9" fill="#2E7D32"/>
</svg>
