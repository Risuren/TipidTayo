<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="pigBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="goldCoin" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="100" cy="180" rx="65" ry="12" fill="#E2E8F0" opacity="0.6"/>

  <!-- Left Ear -->
  <path d="M 50 65 C 35 35 60 25 75 48 Z" fill="#388E3C" filter="url(#softShadow)"/>
  <path d="M 55 60 C 45 42 60 35 70 50 Z" fill="#A5D6A7"/>

  <!-- Right Ear -->
  <path d="M 150 65 C 165 35 140 25 125 48 Z" fill="#388E3C" filter="url(#softShadow)"/>
  <path d="M 145 60 C 155 42 140 35 130 50 Z" fill="#A5D6A7"/>

  <!-- Main Body (Chubby Piggy Bank) -->
  <circle cx="100" cy="110" r="68" fill="url(#pigBody)" filter="url(#softShadow)"/>

  <!-- Coin Slot on Top -->
  <rect x="88" y="44" width="24" height="6" rx="3" fill="#1B4332"/>

  <!-- Eyes - Happy Curved Cheerful -->
  <path d="M 68 98 Q 78 88 88 98" fill="none" stroke="#1B4332" stroke-width="4.5" stroke-linecap="round"/>
  <path d="M 112 98 Q 122 88 132 98" fill="none" stroke="#1B4332" stroke-width="4.5" stroke-linecap="round"/>

  <!-- Rosy Cheeks -->
  <circle cx="62" cy="112" r="10" fill="#FF8A80" opacity="0.5"/>
  <circle cx="138" cy="112" r="10" fill="#FF8A80" opacity="0.5"/>

  <!-- Snout -->
  <ellipse cx="100" cy="116" rx="24" ry="17" fill="#81C784" stroke="#2E7D32" stroke-width="2"/>
  <!-- Nostrils -->
  <ellipse cx="92" cy="116" rx="4" ry="6" fill="#1B4332"/>
  <ellipse cx="108" cy="116" rx="4" ry="6" fill="#1B4332"/>

  <!-- Cheerful Smile Under Snout -->
  <path d="M 90 138 Q 100 148 110 138" fill="none" stroke="#1B4332" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Gold Peso Coin held proudly -->
  <g transform="translate(130, 115)">
    <circle cx="18" cy="18" r="18" fill="url(#goldCoin)" stroke="#B45309" stroke-width="2" filter="url(#softShadow)"/>
    <text x="18" y="24" font-family="Inter, sans-serif" font-size="16" font-weight="900" fill="#78350F" text-anchor="middle">₱</text>
  </g>

  <!-- Little Front Feet -->
  <ellipse cx="78" cy="172" rx="14" ry="9" fill="#2E7D32"/>
  <ellipse cx="122" cy="172" rx="14" ry="9" fill="#2E7D32"/>
</svg>
