<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="pigBodyVault" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#1D4ED8"/>
    </linearGradient>
    <linearGradient id="goldPadlock" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="softShadowVault" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="100" cy="180" rx="65" ry="12" fill="#E2E8F0" opacity="0.6"/>

  <!-- Left Ear -->
  <path d="M 50 65 C 35 35 60 25 75 48 Z" fill="#388E3C" filter="url(#softShadowVault)"/>
  <path d="M 55 60 C 45 42 60 35 70 50 Z" fill="#A5D6A7"/>

  <!-- Right Ear -->
  <path d="M 150 65 C 165 35 140 25 125 48 Z" fill="#388E3C" filter="url(#softShadowVault)"/>
  <path d="M 145 60 C 155 42 140 35 130 50 Z" fill="#A5D6A7"/>

  <!-- Main Body -->
  <circle cx="100" cy="110" r="68" fill="url(#pigBodyVault)" filter="url(#softShadowVault)"/>

  <!-- Coin Slot on Top -->
  <rect x="88" y="44" width="24" height="6" rx="3" fill="#1B4332"/>

  <!-- Confident Focused Eyes -->
  <ellipse cx="76" cy="95" rx="6" ry="8" fill="#1B4332"/>
  <circle cx="74" cy="93" r="2.5" fill="#FFFFFF"/>
  <ellipse cx="124" cy="95" rx="6" ry="8" fill="#1B4332"/>
  <circle cx="122" cy="93" r="2.5" fill="#FFFFFF"/>

  <!-- Rosy Cheeks -->
  <circle cx="62" cy="112" r="9" fill="#FF8A80" opacity="0.5"/>
  <circle cx="138" cy="112" r="9" fill="#FF8A80" opacity="0.5"/>

  <!-- Snout -->
  <ellipse cx="100" cy="116" rx="24" ry="17" fill="#81C784" stroke="#2E7D32" stroke-width="2"/>
  <!-- Nostrils -->
  <ellipse cx="92" cy="116" rx="4" ry="6" fill="#1B4332"/>
  <ellipse cx="108" cy="116" rx="4" ry="6" fill="#1B4332"/>

  <!-- Proud Confident Smirk -->
  <path d="M 92 138 Q 102 146 112 137" fill="none" stroke="#1B4332" stroke-width="3" stroke-linecap="round"/>

  <!-- Vault Shield Held in Front -->
  <g transform="translate(118, 96)" filter="url(#softShadowVault)">
    <!-- Shield Outline -->
    <path d="M 18 0 C 34 0 40 8 40 22 C 40 38 24 50 18 56 C 12 50 -4 38 -4 22 C -4 8 2 0 18 0 Z" fill="url(#shieldGrad)" stroke="#1E3A8A" stroke-width="2.5"/>
    <!-- Padlock on Shield -->
    <rect x="10" y="22" width="16" height="14" rx="3" fill="url(#goldPadlock)" stroke="#78350F" stroke-width="1.5"/>
    <path d="M 13 22 V 16 A 5 5 0 0 1 23 16 V 22" fill="none" stroke="#78350F" stroke-width="2"/>
    <circle cx="18" cy="28" r="2" fill="#78350F"/>
  </g>

  <!-- Left Trotter Supporting Body -->
  <ellipse cx="50" cy="130" rx="12" ry="10" fill="#2E7D32"/>

  <!-- Little Front Feet -->
  <ellipse cx="78" cy="172" rx="14" ry="9" fill="#2E7D32"/>
  <ellipse cx="122" cy="172" rx="14" ry="9" fill="#2E7D32"/>
</svg>
