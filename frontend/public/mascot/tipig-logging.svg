<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="pigBodyLogging" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#2E7D32"/>
    </linearGradient>
    <linearGradient id="notebookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <filter id="softShadowLogging" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="100" cy="180" rx="65" ry="12" fill="#E2E8F0" opacity="0.6"/>

  <!-- Left Ear -->
  <path d="M 50 65 C 35 35 60 25 75 48 Z" fill="#388E3C" filter="url(#softShadowLogging)"/>
  <path d="M 55 60 C 45 42 60 35 70 50 Z" fill="#A5D6A7"/>

  <!-- Right Ear -->
  <path d="M 150 65 C 165 35 140 25 125 48 Z" fill="#388E3C" filter="url(#softShadowLogging)"/>
  <path d="M 145 60 C 155 42 140 35 130 50 Z" fill="#A5D6A7"/>

  <!-- Main Body -->
  <circle cx="100" cy="110" r="68" fill="url(#pigBodyLogging)" filter="url(#softShadowLogging)"/>

  <!-- Coin Slot on Top -->
  <rect x="88" y="44" width="24" height="6" rx="3" fill="#1B4332"/>

  <!-- Focused, Curious Eyes Looking at Ledger -->
  <ellipse cx="76" cy="96" rx="6" ry="8" fill="#1B4332"/>
  <circle cx="78" cy="94" r="2.5" fill="#FFFFFF"/>
  <ellipse cx="124" cy="96" rx="6" ry="8" fill="#1B4332"/>
  <circle cx="126" cy="94" r="2.5" fill="#FFFFFF"/>

  <!-- Rosy Cheeks -->
  <circle cx="62" cy="112" r="9" fill="#FF8A80" opacity="0.5"/>
  <circle cx="138" cy="112" r="9" fill="#FF8A80" opacity="0.5"/>

  <!-- Snout -->
  <ellipse cx="100" cy="116" rx="24" ry="17" fill="#81C784" stroke="#2E7D32" stroke-width="2"/>
  <!-- Nostrils -->
  <ellipse cx="92" cy="116" rx="4" ry="6" fill="#1B4332"/>
  <ellipse cx="108" cy="116" rx="4" ry="6" fill="#1B4332"/>

  <!-- Cute Smile -->
  <path d="M 92 138 Q 100 146 108 138" fill="none" stroke="#1B4332" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Student Ledger / Notebook (Held in Left Trotter) -->
  <g transform="translate(38, 105)" filter="url(#softShadowLogging)">
    <rect x="0" y="0" width="34" height="44" rx="4" fill="url(#notebookCover)" stroke="#064E3B" stroke-width="1.5"/>
    <rect x="4" y="3" width="26" height="38" rx="2" fill="#FFFFFF"/>
    <!-- Notebook rule lines -->
    <line x1="8" y1="10" x2="26" y2="10" stroke="#CBD5E1" stroke-width="1.5"/>
    <line x1="8" y1="16" x2="26" y2="16" stroke="#CBD5E1" stroke-width="1.5"/>
    <line x1="8" y1="22" x2="26" y2="22" stroke="#CBD5E1" stroke-width="1.5"/>
    <line x1="8" y1="28" x2="22" y2="28" stroke="#CBD5E1" stroke-width="1.5"/>
    <!-- Checkmark -->
    <path d="M 8 35 L 12 38 L 18 32" fill="none" stroke="#10B981" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Yellow Pencil (Held in Right Trotter) -->
  <g transform="translate(136, 108) rotate(35)" filter="url(#softShadowLogging)">
    <!-- Pencil Body -->
    <rect x="0" y="0" width="8" height="34" fill="#FBBF24" stroke="#B45309" stroke-width="1"/>
    <!-- Eraser Top -->
    <rect x="0" y="-8" width="8" height="8" rx="2" fill="#F472B6"/>
    <rect x="0" y="-3" width="8" height="3" fill="#94A3B8"/>
    <!-- Tip -->
    <polygon points="0,34 8,34 4,42" fill="#FDE68A"/>
    <polygon points="2,38 6,38 4,42" fill="#1B4332"/>
  </g>

  <!-- Little Front Feet -->
  <ellipse cx="78" cy="172" rx="14" ry="9" fill="#2E7D32"/>
  <ellipse cx="122" cy="172" rx="14" ry="9" fill="#2E7D32"/>
</svg>
