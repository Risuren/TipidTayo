<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="pigBodyThink" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4CAF50"/>
      <stop offset="100%" stop-color="#1B5E20"/>
    </linearGradient>
    <linearGradient id="bulbGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Ground Shadow -->
  <ellipse cx="100" cy="180" rx="65" ry="12" fill="#E2E8F0" opacity="0.6"/>

  <!-- Left Ear -->
  <path d="M 50 65 C 35 35 60 25 75 48 Z" fill="#2E7D32" filter="url(#softShadow)"/>
  <path d="M 55 60 C 45 42 60 35 70 50 Z" fill="#A5D6A7"/>

  <!-- Right Ear -->
  <path d="M 150 65 C 165 35 140 25 125 48 Z" fill="#2E7D32" filter="url(#softShadow)"/>
  <path d="M 145 60 C 155 42 140 35 130 50 Z" fill="#A5D6A7"/>

  <!-- Main Body -->
  <circle cx="100" cy="110" r="68" fill="url(#pigBodyThink)" filter="url(#softShadow)"/>

  <!-- Glowing Lightbulb Overhead (AI Idea / Thinking) -->
  <g transform="translate(90, 15)">
    <circle cx="10" cy="10" r="10" fill="url(#bulbGlow)"/>
    <path d="M 7 19 L 13 19 L 11 23 L 9 23 Z" fill="#D97706"/>
    <!-- Glow rays -->
    <line x1="10" y1="-3" x2="10" y2="-7" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="-3" y1="5" x2="-7" y2="3" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="23" y1="5" x2="27" y2="3" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
  </g>

  <!-- Coin Slot -->
  <rect x="88" y="44" width="24" height="6" rx="3" fill="#1B4332"/>

  <!-- Smart Round Spectacles (Glasses) -->
  <circle cx="76" cy="98" r="14" fill="#FFFFFF" fill-opacity="0.3" stroke="#D97706" stroke-width="3"/>
  <circle cx="124" cy="98" r="14" fill="#FFFFFF" fill-opacity="0.3" stroke="#D97706" stroke-width="3"/>
  <line x1="90" y1="98" x2="110" y2="98" stroke="#D97706" stroke-width="3"/>

  <!-- Curious Eyes Looking Up to the Lightbulb -->
  <circle cx="76" cy="94" r="5" fill="#1B4332"/>
  <circle cx="78" cy="92" r="2" fill="#FFFFFF"/>
  <circle cx="124" cy="94" r="5" fill="#1B4332"/>
  <circle cx="126" cy="92" r="2" fill="#FFFFFF"/>

  <!-- Snout -->
  <ellipse cx="100" cy="118" rx="24" ry="17" fill="#81C784" stroke="#2E7D32" stroke-width="2"/>
  <ellipse cx="92" cy="118" rx="4" ry="6" fill="#1B4332"/>
  <ellipse cx="108" cy="118" rx="4" ry="6" fill="#1B4332"/>

  <!-- Thoughtful Pout Mouth -->
  <ellipse cx="100" cy="142" rx="4" ry="4" fill="#1B4332"/>

  <!-- Thinking Hand on Chin -->
  <ellipse cx="126" cy="138" rx="12" ry="8" fill="#388E3C" stroke="#2E7D32" stroke-width="1.5"/>

  <!-- Feet -->
  <ellipse cx="78" cy="172" rx="14" ry="9" fill="#2E7D32"/>
  <ellipse cx="122" cy="172" rx="14" ry="9" fill="#2E7D32"/>
</svg>
